name: Publish personal assistant

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static app
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npm run build
      - name: Publish the built app
        run: |
          # Keep the finished website outside the repository while the branch is cleaned.
          mkdir -p "$RUNNER_TEMP/personal-assistant-site"
          cp -r out/. "$RUNNER_TEMP/personal-assistant-site/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          git clean -fdx
          cp -r "$RUNNER_TEMP/personal-assistant-site/." .
          touch .nojekyll
          git add --all
          git commit -m "Publish app"
          git push --force origin gh-pages
